# -------------------------------------------------------
# Low Power project config - NCS 3.3.0 / Zephyr 3.7
# ble_demo_lp - optimized for nRF54L15 power efficiency
# -------------------------------------------------------

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TxPower_Beacon"
CONFIG_BT_MAX_CONN=1

# HCI Vendor-Specific extensions
CONFIG_BT_HCI_VS=y

# Disable unused BT features
CONFIG_BT_SMP=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GATT_DYNAMIC_DB=n

# Console / logging — RTT instead of UART to save power
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# Reduced heap and stack
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# nRF54L15: GRTC system timer
CONFIG_NRF_GRTC_TIMER=y
CONFIG_NRF_GRTC_START_SYSCOUNTER=y

# -------------------------------------------------------
# Customer Timing Configuration
# -------------------------------------------------------

# Advertising interval in milliseconds (default: 2400ms = 2.4 seconds)
# Valid range: 20ms - 10240ms
CONFIG_APP_ADV_INTERVAL_MS=2000

# Advertising duration in milliseconds (default: 15000ms = 15 seconds)
CONFIG_APP_ADV_DURATION_MS=10000

# Sleep duration in milliseconds (default: 5000ms = 5 seconds)
CONFIG_APP_SLEEP_DURATION_MS=15000

# TX Power level in dBm (default: 0 dBm)
# Valid values: 3, 0, -4, -8, -12, -16, -20
CONFIG_APP_TX_POWER_DBM=0
